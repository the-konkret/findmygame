<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- colour of the phone browser's address bar -->
    <meta name="theme-color" content="#0b0b0c" />
    <!-- light / dark: apply a saved "light" before anything is drawn (src/lib/theme.ts) -->
    <script>
      try {
        if (localStorage.getItem('fmg-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f6f7');
        }
      } catch (e) {}
    </script>
    <title>FindMyGame</title>
    <!-- tab icon: the orange ring-and-dot from the logo (SVG for sharp edges, PNG for older browsers) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- icon when the site is added to a phone home screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
